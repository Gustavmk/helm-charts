# Default values for dotnet-boilerplate-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/gustavmk/dotnet-api-boilerplate
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "sha-5433643b46a75e1756a1d4c3cd7fa24e0829c158"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # Matches ASPNETCORE_URLS (http://+:9090) from docker-compose.override.yml
  port: 9090

# Port the container listens on. Defaults to service.port when unset.
# Derived from ASPNETCORE_URLS=http://+:9090
containerPort: 9090

# Environment variables passed to the container.
# Mirrors docker-compose.override.yml -> services.boilerplate-api.environment
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: ASPNETCORE_URLS
    value: "http://+:9090"
  # The DB connection string (with credentials) is no longer set here in plain
  # text. It lives in the Secret rendered from `.Values.secret` below and is
  # injected into the container via `envFrom.secretRef`.

# Secret holding sensitive environment variables (e.g. the DB connection string).
# When `create` is true the chart renders templates/secret.yaml and the
# Deployment loads it via `envFrom.secretRef` automatically.
# To use a Secret you manage outside the chart, set `create: false` and `name`.
secret:
  create: false
  # Name of the Secret. Defaults to the chart fullname when empty.
  name: ""
  # Rendered into the Secret's stringData (plain text in values, encoded by k8s).
  # When the bundled `postgresql` StatefulSet is enabled, point Host at its
  # Service: "<release-name>-dotnet-boilerplate-api-postgresql".
  stringData:
    ConnectionStrings__DefaultConnection: "Host=SERVER;Port=5432;Database=DATABASENAME;Username=USER;Password=YOUR PASSWORD"
  # Alternatively, pre-encoded base64 values.
  # data: {}

# Extra sources of environment variables (e.g. an additional Secret or ConfigMap).
# The chart-managed Secret above is added automatically when secret.create/name
# is set; entries here are appended after it.
# envFrom:
#   - configMapRef:
#       name: boilerplate-api-extra

# Bundled PostgreSQL database, deployed as a single-replica StatefulSet.
# Meant for dev/test and small self-contained deployments. For production use a
# managed database (or a dedicated operator) and set `enabled: false`.
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: app_user
    database: HeroDb
    # Password for the user above. Required unless `existingSecret` is set.
    password: "changeme"
    # Reference an existing Secret instead of letting the chart create one.
    existingSecret: ""
    secretKeys:
      passwordKey: postgres-password
  service:
    port: 5432
  persistence:
    enabled: true
    # "-" forces an empty storageClassName; "" (default) uses the cluster default.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    annotations: {}
  resources: {}
    # limits:
    #   cpu: 500m
    #   memory: 512Mi
    # requests:
    #   cpu: 250m
    #   memory: 256Mi
  podSecurityContext:
    fsGroup: 999
  securityContext:
    runAsUser: 999
    runAsNonRoot: true
  nodeSelector: {}
  tolerations: []
  affinity: {}

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# /health/live is a dummy check (process is up); /health/ready validates every
# dependency (database, ...). See Boilerplate.Api HealthCheckSetup.
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
